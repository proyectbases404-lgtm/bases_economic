<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
   
</head>


<body>

    <div class="box_pdr_producto">

        <header class="header_productos">
            <div>
                <h1>Ventas Realizadas</h1>


            </div>


            <div class="box_input_agg">
                <h3>Filtrar por tipo de pago</h3>

                <select name="Selec_pago" id="Selec_pago">
                    <option value="">Filtrar por tipo de pago</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="transferencia">Transferencia</option>
                </select>

            </div>

            <div class="card_info ingresos">
                <div class="box_flot">
                    <label class="label_flot">Hoy</label>
                </div>
                <div class="icon_box ">
                    <img src="img/mano.png" class="card_img carrito">
                </div>
                <h3>C$ 0.00</h3>
                <label class="label_card">Efectivo</label>
            </div>

        </header>

        <div class="box_tb_ventas">
            <table class="tb_ventas">
                <thead>
                    <tr>
                        <th>Ver</th>
                        <th>Venta</th>
                        <th>Monto</th>
                        <th>Fecha Realizada</th>
                        <th>Forma de pago</th>
                        <th>Realizada por</th>

                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <button class="btn_modi_gestion" id="slct_vent">Observar venta</button>
                        </td>
                        <td>VTA-0001</td>
                        <td>C$10.00</td>
                        <td>2023-12-31</td>
                        <td>Efectivo</td>
                        <td>Elizabeth</td>

                    </tr>


                </tbody>
            </table>
        </div>
    </div>


</body>

</html>
