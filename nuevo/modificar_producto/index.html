<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Producto</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container_modify_product">

        <div class="info_enca_modify">
            <h1>Modificar Producto</h1>

            <img src="img/volver.png" alt="" id="regr_modify_produ" class="regr_modify_produ">

        </div>


        <form method="POST" class="container_modify_product">

            <!-- INFORMACIÓN DEL PRODUCTO -->
            <h2>Información del Producto</h2>
            <section class="form_section_modify info_producto_modify">


                <div class="form_group_modify">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto">
                </div>

                <div class="form_group_modify">
                    <label for="modify_categoria">Categoría</label>
                    <select name="modify_categoria" id="modify_categoria">
                        <option value="">Seleccionar categoría</option>
                        <option value="cervezas">Cervezas</option>
                        <option value="vinos">Vinos</option>
                        <option value="ron">Ron</option>
                        <option value="whisky">Whisky</option>
                    </select>
                </div>

                <div class="form_group_modify">
                    <label for="modify_ubicacion">Ubicación</label>
                    <select name="modify_ubicacion" id="modify_ubicacion">
                        <option value="">Seleccionar ubicación</option>
                        <option value="almacen">Almacén</option>
                        <option value="mostrador">Mostrador</option>
                    </select>
                </div>

                <div class="form_group_modify">
                    <label for="num_lote">Número de lote</label>
                    <input type="text" id="num_lote" name="num_lote" placeholder="Número de lote">
                </div>

                <div class="form_group_modify">
                    <label for="fecha_vencimiento">Fecha de vencimiento</label>
                    <input type="date" id="fecha_vencimiento" name="fecha_vencimiento">
                </div>

                <div class="form_group_modify">
                    <label for="graduacion">Graduación alcohólica</label>
                    <input type="number" id="graduacion" name="graduacion" placeholder="Ej: 40" step="0.1">
                </div>

            </section>

            <!-- INVENTARIO -->
            <h2>Detalles de Inventario</h2>
            <section class="form_section_modify det_producto_modify">


                <div class="form_group_modify">
                    <label for="precio_compra">Precio de compra</label>
                    <input type="number" id="precio_compra" name="precio_compra" placeholder="Precio de compra"
                        step="0.01">
                </div>

                <div class="form_group_modify">
                    <label for="precio_venta">Precio de venta</label>
                    <input type="number" id="precio_venta" name="precio_venta" placeholder="Precio de venta"
                        step="0.01">
                </div>

                <div class="form_group_modify">
                    <label for="stock_inicial">Stock inicial</label>
                    <input type="number" id="stock_inicial" name="stock_inicial" placeholder="Stock inicial">
                </div>

                <div class="form_group_modify">
                    <label for="aviso_stock">Aviso de stock bajo</label>
                    <input type="number" id="aviso_stock" name="aviso_stock" placeholder="Cantidad mínima">
                </div>

                <div class="form_group_modify">
                    <label for="bonificacion">Bonificación</label>
                    <input type="text" id="bonificacion" name="bonificacion" placeholder="Bonificación">
                </div>

                <div class="form_group_modify">
                    <label for="modify_proveedor">Proveedor</label>
                    <select name="modify_proveedor" id="modify_proveedor">
                        <option value="">Seleccionar proveedor</option>
                        <option value="proveedor1">Proveedor 1</option>
                        <option value="proveedor2">Proveedor 2</option>
                    </select>
                </div>



            </section>

            <div class="form_actions_modify select_preview_modify" id="btn_preview">
                <button type="button">Actualizar Producto</button>
            </div>
        </form>

    </div>

</body>

</html>
