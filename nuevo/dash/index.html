<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box_dash">
        <div class="dash_box">
            <div class="chart-container">
                <h2>Ventas de la Semana</h2>

                <div class="chart">
                    <div class="bar-container">
                        <div class="bar lunes"><span>120</span></div>
                        <div class="label">Lun</div>
                    </div>

                    <div class="bar-container">
                        <div class="bar martes"><span>180</span></div>
                        <div class="label">Mar</div>
                    </div>

                    <div class="bar-container">
                        <div class="bar miercoles"><span>90</span></div>
                        <div class="label">Mié</div>
                    </div>

                    <div class="bar-container">
                        <div class="bar jueves"><span>220</span></div>
                        <div class="label">Jue</div>
                    </div>

                    <div class="bar-container">
                        <div class="bar viernes"><span>160</span></div>
                        <div class="label">Vie</div>
                    </div>
                    <div class="bar-container">
                        <div class="bar sabado"><span>160</span></div>
                        <div class="label">Sab</div>
                    </div>
                    <div class="bar-container">
                        <div class="bar domingo"><span>160</span></div>
                        <div class="label">Dom</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ulti_ventas">
            <h2 >Producto más vendido</h2>
            <div class="contenedor">
                
                <div class="dona"></div>
                   
                <div class="leyenda">
                    <div class="item">
                        <div class="color" style="background:#6C63FF;"></div> Whisky (30%)
                    </div>
                    <div class="item">
                        <div class="color" style="background:#4DD0E1;"></div> Vodka (25%)
                    </div>
                    <div class="item">
                        <div class="color" style="background:#2F3E46;"></div> Ron (20%)
                    </div>
                    <div class="item">
                        <div class="color" style="background:#2EC4B6;"></div> Cerveza (15%)
                    </div>
                    <div class="item">
                        <div class="color" style="background:#E0E0E0;"></div> Tequila (10%)
                    </div>
                </div>
            </div>
        </div>
    </div>



</body>

</html>
