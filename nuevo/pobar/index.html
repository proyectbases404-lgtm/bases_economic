<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Productos</title>
    <link rel="stylesheet" href="srtyle.css">
</head>

<body>

    <div class="container">

        <h1 class="title">
            Editar Productos
        </h1>

        <div class="grid">

            <!-- LISTA -->

            <div class="card">

                <input 
                    type="text" 
                    class="search"
                    placeholder="Buscar producto..."
                >

                <div class="product_list">

                    <div class="product_item active">

                        <div class="product_name">
                            Cerveza Toña
                        </div>

                        <div class="product_category">
                            Licores
                        </div>

                    </div>

                    <div class="product_item">

                        <div class="product_name">
                            Marlboro
                        </div>

                        <div class="product_category">
                            Cigarros
                        </div>

                    </div>

                    <div class="product_item">

                        <div class="product_name">
                            Pepsi
                        </div>

                        <div class="product_category">
                            Bebidas
                        </div>

                    </div>

                    <div class="product_item">

                        <div class="product_name">
                            Flor de Caña
                        </div>

                        <div class="product_category">
                            Licores
                        </div>

                    </div>

                </div>

            </div>

            <!-- FORMULARIO -->

            <div class="card">

                <div class="form_container">

                    <h2>
                        Información del Producto
                    </h2>

                    <div class="form_group">

                        <label>
                            Nombre del Producto
                        </label>

                        <input 
                            type="text"
                            value="Cerveza Toña"
                        >

                    </div>

                    <div class="form_group">

                        <label>
                            Categoría
                        </label>

                        <select>

                            <option>Licores</option>
                            <option>Cigarros</option>
                            <option>Bebidas</option>
                            <option>Snacks</option>

                        </select>

                    </div>

                    <div class="form_group">

                        <label>
                            Agrupaciones Permitidas
                        </label>

                        <div class="group_container">

                            <label class="group_item">

                                <input type="checkbox" checked>

                                Unidad

                            </label>

                            <label class="group_item">

                                <input type="checkbox">

                                Paquete

                            </label>

                            <label class="group_item">

                                <input type="checkbox" checked>

                                Six Pack

                            </label>

                            <label class="group_item">

                                <input type="checkbox" checked>

                                Caja

                            </label>

                            <label class="group_item">

                                <input type="checkbox">

                                Cajilla

                            </label>

                            <label class="group_item">

                                <input type="checkbox">

                                Botella

                            </label>

                            <label class="group_item">

                                <input type="checkbox">

                                Media Botella

                            </label>

                        </div>

                    </div>

                    <div class="form_group">

                        <label>
                            Ubicación
                        </label>

                        <select>

                            <option>Bodega A</option>
                            <option>Bodega B</option>
                            <option>Refrigerador</option>
                            <option>Vitrina</option>

                        </select>

                    </div>

                    <div class="buttons">

                        <button class="btn btn_save">
                            Guardar Cambios
                        </button>

                        <button class="btn btn_delete">
                            Eliminar
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
