<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="boxs_card">
        <div class="card_info ingresos">
            <div class="box_flot">
                <label class="label_flot">Hoy</label>
            </div>
            <div class="icon_box">
                <img src="img/carrito.png" class="card_img carrito">
            </div>
            <span class="span_card">INGRESOS DEL DÍA</span>
            <h3>C$ 0.00</h3>
            <label class="label_card">Disponible</label>
        </div>

        <div class="card_info productos">
            <div class="box_flot producs">
                <label class="label_flot">Total</label>
            </div>
            <div class="icon_box violet">
                <img src="img/caja.png" class="card_img">
            </div>
            <span class="span_card">PRODUCTOS</span>
            <h3>6</h3>
            <label class="label_card">En inventario</label>
        </div>

        <div class="card_info inventario">
            <div class="box_flot">
                <label class="label_flot">valor</label>
            </div>
            <div class="icon_box green">
                <img src="img/dolar.png" class="card_img">
            </div>
            <span class="span_card">VALOR INVENTARIO</span>
            <h3>C$ 0.00</h3>
            <label class="label_card">Valor estimado</label>
        </div>

        <div class="card_info stock">
            <div class="box_flot box_st">
                <label class="label_flot">stock</label>
            </div>
            <div class="icon_box plomo">
                <img src="img/advertencia.png" class="card_img">
            </div>
            <span class="span_card">STOCK BAJO</span>
            <h3>8</h3>
            <label class="label_card">Productos bajos</label>
        </div>

    </div>


</body>

</html>
